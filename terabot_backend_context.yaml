schema_version: terrabot.terraform-primary-context.v1
generated_at: "2026-08-31"
purpose: >-
  Primary repository-alignment context for Terrabot when it reads, creates,
  modifies, validates, commits, and opens pull requests for Terraform in
  venasolutions/tf-devops and venasolutions/tf-azure-hub.

meta:
  covers:
    - venasolutions/tf-devops
    - venasolutions/tf-azure-hub
  default_branch: main
  delete_branch_on_merge: true
  merge_commit_title: PR_TITLE
  merge_commit_message: BLANK
  terrabot_must_not:
    - Push directly to main
    - Apply terraform except via existing Azure DevOps pipelines after review
    - Perform terraform state mv/rm/import unless a human runbook was requested
    - "Fix" legacy code to match newer conventions unless that file is already being changed
    - Apply terraform-github .serena memories to these repos (different product)

# -----------------------------------------------------------------------------
# Context sources terrabot MUST read first (per repo)
# -----------------------------------------------------------------------------
read_order:
  both_repos:
    - .github/PULL_REQUEST_TEMPLATE.md   # org-managed from terraform-github local_file devops.md
    - .github/CODEOWNERS
    - .github/copilot-instructions.md
    - .cm/gitstream.cm
    - README.md
  tf_devops_only:
    - CLAUDE.md
    - .github/instructions/terraform-modules.instructions.md   # applyTo terraform/modules/**
    - .github/instructions/hub-environments.instructions.md    # on-demand hub/DR/sqlstaging
    - .github/instructions/pr_template_assistance.instructions.md
    - terraform/README.md
    - terraform/modules/<name>/README.md when touching that module
  tf_azure_hub_only:
    - docs/aks.md when touching AKS/k8s.tf
    - monitoring/dd_monitors/README.md when touching Datadog monitors
    - .pre-commit-config.yaml
  serena:
    - Neither tf-devops nor tf-azure-hub currently contains .serena/
    - terraform-github/.serena/memories/* is GitHub org/repo/team IaC only
    - Do NOT copy terraform-github conventions (DynamoDB state lock, vena_repos/*.tf, default_branch develop) into these repos
    - If .serena/ is added later, parse .serena/memories/ and treat as repo-specific exceptions over this file

# -----------------------------------------------------------------------------
# Shared PR / git / review (same managed PR template in both repos)
# -----------------------------------------------------------------------------
pr_and_git:
  origin_of_templates:
    - "PULL_REQUEST_TEMPLATE, gitstream.yml, .cm/gitstream.cm are managed_files from venasolutions/terraform-github"
    - "Do not rewrite CODEOWNERS or the PR template unless the task is to change managed files in terraform-github"
  pr_title:
    - "JIRA key required. gitStream flags missing JIRA in branch name AND description"
    - "Checklist in template: PR Title is [#INF-<num>] (eg., [#STO-1])"
    - "tf-devops copilot-instructions: STO-NNNN Brief description"
    - "pr_template_assistance: [TICKET-NUM] Brief description (e.g. STO-7741 …)"
    - "Terrabot should use: STO-NNNN Short summary  (or [#STO-NNNN] Short summary). Put the JIRA URL as the first line of the body."
  pr_body:
    - Fill .github/PULL_REQUEST_TEMPLATE.md structure; do not invent a different template
    - Sections: JIRA ticket link, Description, Why was this required?, How to test?, Deployment plan, Checklist, Risk assessment [REQUIRED]
    - Risk assessment: default to "No to all" + label requires-review:team-only for routine Terraform
    - Labels from template: requires-review:hotfix-process | requires-review:cab | requires-review:security | requires-review:third-party-libraries | requires-review:team-only
    - How to test: include terraform fmt/validate/plan commands for affected env dirs or var-file sets
    - Deployment plan: Azure DevOps pipeline apply after merge (prod/statestreet/bolt have extra ADO approval); npr/sbx may applyFromBranch
  codeowners:
    tf-devops: "* @venasolutions/devops-guardians-team; dns_firewall.tf also @venasolutions/information-security-team; .github/workflows and .cm @venasolutions/tooling-team"
    tf-azure-hub: "* @venasolutions/saaseng-team; .github/workflows and .cm @venasolutions/tooling-team"
  gitstream:
    - LinearB AI review on non-draft PRs
    - Optional labels: gitstream:time-to-review, gitstream:jira-check, gitstream:code-experts, gitstream:share-knowledge
  commits:
    - Conventional-ish is fine: feat|fix|chore|docs|ci|refactor
    - Include JIRA id in subject or body when known
  branches:
    - Feature branches off main; no GitFlow develop branch in these two repos
    - Prefer names that include the JIRA key so gitStream sees it

authority_and_precedence:
  rule: >-
    This file is the primary authoring playbook, but it is not a substitute for
    current repository evidence. For exact paths, values, versions, module
    inputs, branch policy, and pipeline behavior, live GitHub content at the
    selected commit always wins.
  order:
    - "Live selected-commit Terraform and pipeline files supplied in context_pack."
    - "Live selected-commit README files, module READMEs, .github instructions, PR templates, CODEOWNERS, and .serena/.Serena files when present."
    - "This primary Terraform context for stable repository conventions and workflow rules."
    - "Validated repository-index context for prior clarifications and relationships; revalidate it against live files before use."
  conflict_behavior:
    - "Do not silently choose this file over contradictory live code."
    - "Log the conflicting path and follow the current repository artifact."
    - "Do not invent a convention when the nearest live sibling demonstrates one."

snapshot_evidence:
  tf_devops:
    repository: "venasolutions/tf-devops"
    snapshot_branch: "vena-ishika/STO-9604/terrabot-test"
    snapshot_commit: "1a4115a7249ef82ca9fc642cda1eacfc012c2252"
    inspected_artifacts:
      - "README.md"
      - "terraform/README.md"
      - ".github/copilot-instructions.md"
      - ".github/instructions/terraform-modules.instructions.md"
      - ".github/instructions/hub-environments.instructions.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/CODEOWNERS"
      - ".cm/gitstream.cm"
      - "pipeline-templates/tf-stages.yml"
      - "pipeline-templates/tf-code-checks.yml"
      - "representative backend.tf, versions.tf, main.tf, vars.tf, outputs.tf, and module files"
  tf_azure_hub:
    repository: "venasolutions/tf-azure-hub"
    snapshot_branch: "vena-ishika/STO-9604/terrabot-test"
    snapshot_commit: "e2e12cb9f60f0e6a93e5443e250f85e75da381a7"
    inspected_artifacts:
      - "README.md"
      - ".github/copilot-instructions.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/CODEOWNERS"
      - ".cm/gitstream.cm"
      - ".pre-commit-config.yaml"
      - ".tool-versions"
      - "provider.tf"
      - "pipelines/azure-pipelines-npr.yml"
      - "pipelines/azure-pipelines-prd.yml"
      - "representative root .tf files and vars/**/*.tfvars"
  serena_status:
    snapshot_result: >-
      No .serena or .Serena directory was present in either supplied snapshot.
      This is not a permanent exception. Terrabot must scan the live selected
      commit and read any such files if they are added later.

mandatory_task_sequence:
  - "Resolve cloud, repository, environment, requested operation, and target branch before generation."
  - "Fetch the selected repository tree and exact current commit SHA."
  - "Read the complete target file and the nearest relevant sibling files; do not generate from snippets alone."
  - "Read applicable repository guidance in .github, README files, module READMEs, and .serena/.Serena when present."
  - "Retrieve validated repository-index context for the repo and request. Treat it as a hint until live evidence confirms it."
  - "Choose the existing repository pattern that implements the requested behavior. Ask a clarification only when live evidence leaves more than one materially valid target."
  - "Generate complete final contents for every changed file. Never emit placeholders, scratch paths, partial fragments, or omitted unchanged sections."
  - "Run deterministic target, minimal-diff, structure, syntax, and repository-specific validators before writing."
  - "Use existing Terrabot branch, commit, push, PR, Azure DevOps plan, plan-risk, drift, and Teams notification workflows. Do not bypass them."
  - "Store only evidence-validated durable facts or resolved clarifications in the repository index."

# ---------------------------------------------------------------------------
# HARD OUTPUT AND DECISION PROTOCOLS (added after run ctx-20260906-182925:
# every failed case traced back to free-form questions, whole-file tfvars
# rewrites, ambiguous repair old_text, or questions emitted during internal
# repair. These protocols are absolute and outrank stylistic guidance.)
# ---------------------------------------------------------------------------
generation_output_contract:
  rule: >-
    Every generation, continuation, and repair response is EXACTLY ONE raw JSON
    object. The first character is { and the last is }. No markdown fences, no
    prose before or after, no apology text. There are only two legal response
    shapes; anything else is a defect.
  shape_generate:
    mode: "infra"
    cloud: "aws | azure"
    workflow: "<expected workflow from backend context>"
    repo_target: "<expected repo target from backend context>"
    title: "short title"
    branch_name: "terrabot/<short-change-slug>"
    summary: "short summary"
    analysis: "3-10 grounded lines citing the live paths used"
    source_paths_used: ["repo/relative/paths actually read"]
    files: [{filename: "repo-relative/path", content: "COMPLETE final file content"}]
    reused_flag: "<existing boolean flag name reused, or empty string>"
    questions: []
  shape_clarify:
    mode: "clarification"
    cloud: "aws | azure"
    workflow: "<expected workflow>"
    question: "ONE short question describing exactly what is ambiguous"
    candidates:
      - index: 1
        path: "repo-relative file that would be edited for this option"
        flag: "boolean variable name (boolean requests) or empty"
        module_source: "module source path (creation requests) or empty"
        current_value: "true|false or empty"
        new_value: "true|false or empty"
        reason: "one line of live repository evidence for this option"
    rules:
      - "mode=clarification is legal ONLY when the boolean_flag_resolution_protocol or creation_target_protocol below explicitly permits it."
      - "candidates[] is REQUIRED and must contain 2-6 live-verified options with real repository paths. A clarification with zero candidates is a defect."
      - "Never put a question in shape_generate.questions and return files=[]. If you must ask, use shape_clarify with candidates."
  clarification_answer_consumption: >-
    When a follow-up message contains a clarification answer (a numeric index
    into your candidates, or a resolved control such as
    "Use <flag> in <path>" / "Create the consumer in <path> using module
    <module_source> modeled on <sibling_path>"), treat it as authoritative.
    Immediately return shape_generate implementing exactly that resolution.
    Asking a second question after a resolution is a defect.

boolean_flag_resolution_protocol:
  purpose: >-
    Requests like "disable the workflow auth service on ECS in dev" or
    "turn on object replication for npr-int" are almost always a one-literal
    flip of an EXISTING boolean in the environment value file. Missing that
    flag is the top historical failure (CONTROL_RESOLUTION_FAILURE).
  procedure:
    - "Resolve the environment value file first: AWS terraform/<account_root>/<environment>/main.tf; Azure vars/<tier>/<hub>/hub.tfvars (dr.tfvars only when the pipeline loads it)."
    - "Enumerate EVERY boolean assignment in that live file (name = true|false), including *_enabled, enable_*, create_*, deploy_* and map/object boolean members."
    - "Match the request semantically: split the requested workload into tokens (e.g. 'workflow auth service' -> workflow, auth, service) and score each boolean by token overlap in its name, nearby comments, and the module/resource wiring it feeds. 'auth-server' and 'auth service' are DIFFERENT workloads; prefer the flag whose distinctive tokens match (enable_auth_service_ecs, not an auth-server flag)."
    - "If exactly one boolean matches: return shape_generate NOW. Never ask. reused_flag = that name."
    - "If two or more booleans genuinely tie after wiring analysis: return shape_clarify listing exactly those flags as candidates with their live current values."
    - "If zero booleans plausibly match: return shape_clarify whose candidates list the closest boolean controls found plus (for creation-like asks) plausible creation targets, so the answering party can pick or redirect."
    - "When backend context (retrieved_value_context, repository_context, resolved_repository_target, or exact_edit_hints) already names a verified path+flag for this request, that target is FINAL. Generating anything else, or asking any question, is a defect."
  tfvars_and_env_file_edits:
    - "A boolean flip changes ONLY the selected literal. files[].content must be the complete live file byte-for-byte with only that literal changed."
    - "Never drop, reorder, reformat, or re-quote any other assignment, comment, or blank line. Removing existing tfvars assignments is a hard backend rejection."
    - "If the live file was truncated in your context (content_truncated_for_transport), do NOT return a full-file rewrite; return repair_edits-style output only if the backend asks for it, otherwise request the full file via the backend contract instead of reconstructing from memory."

creation_target_protocol:
  purpose: >-
    "Provision <module X> in <environment>" requests must land in the live
    consumer file for that environment, modeled on the nearest live sibling.
  procedure:
    - "AWS: the write target is terraform/<account_root>/<environment>/main.tf (append-only consumer delta). Find live siblings that already instantiate the requested module (e.g. */global/kms.tf instantiating terraform/modules/kms_global) and copy their exact source, version, inputs, and naming."
    - "Azure: the write target is the environment hub.tfvars object/flag that the root module family consumes (e.g. module historian_role_assignment gated in root rbac.tf), following the live sibling hub."
    - "If exactly one live-verified target file + module source exists: generate immediately."
    - "If several placements are legitimate: return shape_clarify whose candidates enumerate each concrete option with path + module_source + the sibling file proving it. Free-form questions without candidates are forbidden."

internal_repair_protocol:
  rule: >-
    When the backend sends a repair payload (repair_mode, backend_validation_error,
    repair_files, exact_edit_hints), the response is a REPAIR, not a conversation.
  rules:
    - "Questions are FORBIDDEN in repair responses. Return repair_edits[] (preferred for existing files) or corrected complete files[]."
    - "repair_edits[].old_text must be copied EXACTLY from repair_files[].existing_live_content and must occur exactly once there. If the target line text appears multiple times (23 identical '= false' lines is common in tfvars), copy the target line PLUS the full previous live line (and next line if still ambiguous) so the span is unique. Include line_number when exact_edit_hints provides it."
    - "When exact_edit_hints is non-empty, use it verbatim: old_text = exact_live_line (expanded with neighbors only for uniqueness), new_text = the same line with only the boolean literal changed."
    - "new_text replaces ONLY old_text. Never return the whole file as new_text."
    - "Never resend a previously rejected candidate. Address backend_validation_error literally."
    - "Keep repair responses small: no re-stated repository context, no analysis essays; JSON only."

repository_context_reuse_protocol:
  rule: >-
    Attached repository_context / retrieved_value_context records are
    live-verified prior resolutions. When one maps the requested concept to a
    path+flag for the requested environment, use it directly and generate.
    Re-asking a clarification that stored context already answers is the
    CONTEXT_REUSE_FAILURE defect and is forbidden.

cross_repository_rules:
  change_safety:
    - "Preserve every unrelated existing line, block, resource, function, output, variable, comment, and ordering choice unless the request requires it to change."
    - "For a Boolean-gated modification, change only the selected live Boolean literal after backend verification."
    - "For modification of an existing resource, permit only the smallest targeted delta inside the selected resource or its environment value."
    - "For creation in an existing file, follow the nearest sibling placement. Use append-only behavior only when the live file pattern and Terrabot validator require it."
    - "Never bulk-modernize legacy code as part of an unrelated request."
  source_of_values:
    - "Reuse exact live sibling structure, source, version, provider alias, tags, input order, and naming pattern."
    - "Use concrete non-secret values from the target environment or a verified nearest sibling."
    - "Use the repository's existing secret-reference mechanism. Never write credentials or secret values."
    - "Do not invent account IDs, subscription IDs, regions, CIDRs, names, ARNs, resource IDs, backend keys, module refs, or pipeline parameters."
  terraform_basics:
    - "Use snake_case for Terraform labels and variables unless an existing public interface requires another form."
    - "New input variables need an explicit type and description unless the live scoped convention demonstrates a justified exception."
    - "Pin module and provider versions exactly as the live repository does; never replace a pin with latest."
    - "Use encryption and least privilege where supported, matching the repository's current resource pattern."
    - "Run terraform fmt on changed Terraform files. Do not reformat unrelated files."
  backend_rules:
    - "Terraform backend blocks cannot use normal var.* expressions. Do not copy the invalid variable-based backend templates from the old Copilot context."
    - "Backend and state-key changes are high risk and require explicit request scope, exact sibling evidence, and plan review."
  pull_requests:
    - "Never push directly to the default branch unless the user explicitly authorizes it and repository policy allows it."
    - "Use the live .github/PULL_REQUEST_TEMPLATE.md verbatim as the PR body skeleton."
    - "The supplied snapshot template requires: JIRA ticket link, Description, Why was this required, How to test, Deployment plan, Checklist, and required Risk assessment sections."
    - "The supplied snapshot checklist expects a PR title shaped like [#INF-<num>] and gives [#STO-1] as the example; preserve the exact live convention rather than converting it to a generic Conventional Commit title."
    - "Select the live template's required review label from the actual risk answers, including hotfix-process, cab, security, third-party-libraries, or team-only where applicable. Do not add every label mechanically."
    - "Use the current repository title and Jira conventions from the live template and branch policy."
    - "Do not claim an approval or apply policy that is not visible in the live pipeline or Azure DevOps environment configuration."
  validation:
    - "At minimum perform targeted terraform fmt checks and repository-specific deterministic validation."
    - "Use terraform init -backend=false and terraform validate only where the selected root and providers allow it without credentials."
    - "A real plan may require backend, cloud, GitHub, and module credentials; use the established Azure DevOps pipeline instead of fabricating local success."
    - "Treat planned replacement or destruction as a blocking risk requiring explicit review."

# -----------------------------------------------------------------------------
# tf-devops — AWS SaaS monorepo
# -----------------------------------------------------------------------------
tf_devops:
  identity:
    description: Terraform for Vena multi-tenant SaaS on AWS. No Azure workload code lives here.
    github_actions: enabled
    cicd: Azure DevOps Pipelines
    terraform_pipeline_pin: "1.11.4"
    required_version_hubs: ">= 1.11.4"
    aws_provider_typical: "~> 5.34.0"
    aws_provider_exception: "Some global backends pin ~> 6.21.0; copy the pin from the sibling backend.tf in that account directory, do not 'standardize' them."

  accounts:
    npr-aws-saas:
      id: "520103559707"
      dir: terraform/dev_aws/
      state_bucket: venacloud-terraform-minidev
      ado_role: arn:aws:iam::520103559707:role/vena-ado-role-520103559707
      pipeline: azure-pipelines_dev.yml
    prd-aws-saas:
      id: "987100187255"
      dir: terraform/prod_aws/
      state_bucket: venacloud-terraform
      ado_role: arn:aws:iam::987100187255:role/vena-ado-role-987100187255
      pipeline: azure-pipelines_prod.yml
    statestreet:
      id: "652061513354"
      dir: terraform/statestreet/
      pipeline: azure-pipelines_prod.yml (folderListStateStreet)
      note: Private hub; included when people say prod pipelines, excluded from casual "all hubs" unless named
    other_account_dirs:
      - terraform/services_aws
      - terraform/dev_services_aws
      - terraform/network_services
      - terraform/logarchive
      - terraform/ops_shared_services
      - terraform/audit
      - terraform/root
      - terraform/datadog
      - terraform/pagerduty

  nomenclature:
    hub: One end-to-end implementation of the Vena system (tier npr/prd + name like dev or us4)
    all_hubs: Every env dir under dev_aws, prod_aws, and statestreet EXCEPT devops/global/sqlstaging/observe
    primary_region: At least 3 AZs
    dr: Directory suffix _dr; different region and VPC CIDR from primary

  layout: |
    terraform/
      modules/                 # local modules only; never a registry
      dev_aws/                 # npr hubs + bolt + global + devops + sqlstaging + observe
      prod_aws/                # prod hubs + DR + sqlstaging* + global + devops + observe
      statestreet/
      ...
    pipeline-templates/        # local ADO templates (tf-stages.yml, tf-code-checks.yml)
    azure-pipelines_*.yml      # entrypoints: _dev, _prod, _bolt, _drift, _ops_shared_services, _logarchive_observe

  environment_types:
    vena_hub:
      examples: [bolt, dev, minidev, us1, us2, us3, us4, eu1, eu2, eu4, ca3, statestreet]
      required_files: [backend.tf, versions.tf, main.tf, outputs.tf]
      optional: [s3.tf, providers in main.tf]
      main_tf_must_open_with_locals:
        required: [env, subdomain, region, network_base, source_account_id]
        typical_extras: [env_dashes, sqlstaging_env, high_priority_alert_sns, low_priority_alert_sns, builds_bucket]
      tags: "Always env + role; prod (and prod DR) set VantaNonProd = false in default_tags"
      composition:
        root_module: vena_datacentre via source = "../../modules/vena_datacentre"
        approved_satellites:
          - vena_sqlstaging_peering
          - patch_management (usually twice: Linux + Windows)
        anti_pattern: New standalone modules called from hub main.tf (otel_collector etc. are tech debt; do not add more)
        new_features: Implement as terraform/modules/<name>/ then call from vena_datacentre/*.tf gated by create_* or enable_*
    dr_hub:
      dir_suffix: _dr
      pass: is_dr_region = true
      different_region_and_cidr: true
      subdomain_suffix_example: us1-dr / bolt-dr
      disable_cost_heavy_create_flags:
        - create_mtserver_rds
        - create_template_rds
        - create_auditdb_redshift
        - create_staging_redshift
        - create_bucketav
      keep: VPC, subnets, SGs, Kinesis, S3 (fast failover)
      asg: asg_min_size = 0, asg_max_size = 0
      never_delete_gated_resources: gate with count / create_* / is_dr_region
    sqlstaging:
      dirs: ["*_sqlstaging", "sqlstaging", "sqlstaging_ca", "sqlstaging_eu", "sqlstaging_eu2", "sqlstaging_eu4", "sqlstaging_us4", "sqlstaging_west"]
      root_module: vena_sqlstaging
      files: [backend.tf, main.tf, outputs.tf, versions.tf]
      often_uses: data.terraform_remote_state for Route53 from tf-dns
    global:
      no_hub_locals_pattern: true
      split_files:
        - kms.tf, iam.tf, roles.tf, roles_policy.tf, policy.tf, policy_attachment.tf
        - s3.tf, ecr.tf, acm.tf, acm_pca.tf, cdn.tf, waf.tf, sns.tf
        - lambdas.tf, groups.tf, historian.tf, eks_roles.tf
    devops:
      dirs: [dev_devops, devops]
      unique_files: [hydra.tf, peering.tf, routes.tf, security_groups.tf, lookups.tf]

  actual_env_lists:
    terraform/dev_aws:
      - bolt
      - bolt_dr
      - bolt_sqlstaging
      - dev
      - dev_devops
      - dev_sqlstaging
      - global
      - minidev
      - minidev_sqlstaging
      - observe
    terraform/prod_aws:
      - us1, us1_dr, us2, us2_dr, us3, us3_dr, us4, us4_dr
      - eu1, eu1_dr, eu2, eu2_dr, eu4, eu4_dr
      - ca3, ca3_dr
      - sqlstaging, sqlstaging_ca, sqlstaging_eu, sqlstaging_eu2, sqlstaging_eu4, sqlstaging_us4, sqlstaging_west
      - devops, global, observe
    note_readme_drift:
      - "Root README omits eu4 and sqlstaging_eu4; prod_aws directory and azure-pipelines_prod.yml include them. Trust directories + pipeline folderList."
      - "Bolt is isolated on azure-pipelines_bolt.yml (STO-8969); do not add bolt folders back to azure-pipelines_dev.yml."

  vena_datacentre:
    role: Root module for every Vena hub
    owns:
      - VPC/subnets/SGs/routing
      - RDS (mtserver, template)
      - Redshift (audit, staging)
      - ECS/Fargate/ALB
      - Kinesis + Firehose
      - S3, KMS, Secrets Manager, SSM
      - Route53, CloudFront, WAF
      - CloudWatch, Datadog integration, CloudAMQP
    file_split_examples:
      - vpc.tf, ecs.tf, kinesis.tf, s3.tf, kms.tf, rds_mtserver.tf, rds_template.tf, redshift.tf
      - load_balancers.tf, cloudwatch.tf, dns_firewall.tf (CODEOWNERS: info-sec + guardians)
    wiring_outputs:
      - vpc_id, private_subnet_ids, private_subnet_rtbs
      - ecs_load_balancer_listener_arn, ecs_load_balancer_dns_name, ecs_agent_role_name
      - audit_stream_arn, s3_ss3_arn, rds_sse_arn
    known_exceptions:
      - "local.public_route53_role_arn is a hardcoded IAM ARN in vena_datacentre/main.tf; do not proliferate hardcoded ARNs"
      - "vena_datacentre/versions.tf still has required_version >= 0.12; do not 'fix' unless asked"

  modules:
    path: terraform/modules/<name>
    required_files_for_new_modules: [main.tf, vars.tf, outputs.tf, versions.tf]
    never_name_variables_file: variables.tf
    existing_output_filename_drift: "Some modules use output.tf (s3, security_group, tenant_to_tenant, calc_snapshot). New modules use outputs.tf. Do not rename existing files."
    source_style: 'source = "../../modules/<name>"  # or ../../../ from nested modules'
    never_publish_to_registry: true
    not_all_modules_have_readmes: true
    readme_modules_include:
      - s3, kms, kinesis, cdn, cloudamqp, acm_pca, data_access
      - observe_aws_source, observe_aws_collection
      - ecs, ecs_service_load_balancer_setup
      - cross_account_kms, cross_account_route_53
      - ado-cloudwatch-metrics-publisher, ado-asg-termination-lifecycle
      - patch_validation, lambdas/*
    s3_module_defaults:
      - versioning enabled, logging enabled, SSE required
      - glacier/delete must be explicit (set to -1 to disable)
    feature_flags:
      enable_star: ECS services and app-level features
      create_star: stateful/cost-heavy infra; default true; DR sets false
    dr_variable: |
      variable "is_dr_region" {
        description = "Set to true in DR hub environments to disable non-essential CloudWatch alarms and secondary resources."
        type        = bool
        default     = false
      }
    gate_alarms: 'count = var.is_dr_region ? 0 : 1'
    variables: every variable needs description + type; snake_case
    kms: always encrypt S3, RDS, Kinesis, Redshift, SQS when supported
    no_hardcoded_arns: use data.aws_sns_topic, data.aws_kms_key, data.aws_ssm_parameter, data.aws_secretsmanager_secret
    ssm_optional: |
      data "aws_ssm_parameter" "optional_key" {
        count = local.feature_enabled ? 1 : 0
        name  = "/prod/service/optional-key"
      }

  backend:
    type: s3
    locking: "NO DynamoDB table. Original terrabot drafts were wrong. encrypt = true only."
    region_of_state_bucket: us-east-1   # even when the hub region is ca-central-1 / eu-*
    key_pattern: "<env-or-folder>/terraform.tfstate"   # e.g. us1/terraform.tfstate, bolt-dr/terraform.tfstate, global/terraform.tfstate, dev2/terraform.tfstate
    buckets:
      npr: venacloud-terraform-minidev
      prd: venacloud-terraform
    template_from_live: |
      terraform {
        backend "s3" {
          bucket  = "venacloud-terraform"          # or venacloud-terraform-minidev
          key     = "<folder>/terraform.tfstate"
          region  = "us-east-1"
          encrypt = true
        }
        required_providers {
          aws = {
            source  = "hashicorp/aws"
            version = "~> 5.34.0"
          }
        }
      }
    do_not_use:
      - dynamodb_table
      - var interpolations inside backend blocks (backends are static)
      - invented bucket names like venadev-terraform-state-*

  cicd:
    templates: pipeline-templates/tf-stages.yml
    ado_pipeline_templates_tag: v4.11.02
    auth: ADO service connection + STS assume-role --external-id
    per_folder_stages:
      TF_Test: terraform fmt -check (docker hashicorp/terraform) + Checkov (--soft-fail)
      TF_Plan: terraform plan after assume-role
    applyFromBranch: true on azure-pipelines_dev.yml (npr)
    prod_bolt: extra ADO environment approvals; bolt isolated to prevent accidental apply
    drift: scheduled on npr (cron 30 11 * * 1-5); driftDetectionEnabled on prod/statestreet too
    checkov_default_tf_image_in_template: "1.3.10 is the template default; pipelines override to 1.11.4 — always pass terraformVersion"
  local_validation: |
    cd terraform/dev_aws/dev
    terraform get -update && terraform validate && terraform plan
    # all env dirs in an account:
    cd terraform/dev_aws && make
    # bulk: terraform/plan_test.sh (init/validate/plan each subdir)
  gitignore_exceptions:
    - .terraform.lock.hcl is gitignored in this repo (unusual). Do not add lockfiles.
    - lambda zip artifacts must not be committed

  add_hub_workflow:
    - Copy a sibling hub of the same tier (dev or us1), not an invented template dir (there is no terraform/templates/hub_template)
    - New directory under terraform/<account>/
    - Set locals; unique network_base; unique env string
    - backend.tf with existing bucket + new key
    - Call vena_datacentre + approved satellites only
    - Add folder to the correct azure-pipelines_*.yml folderList (bolt -> bolt pipeline)
    - Plan only that directory locally; attach findings in PR How to test
  change_module_workflow:
    - Edit terraform/modules/<name>
    - If inputs/outputs change, update vena_datacentre (preferred) and any hub callers
    - Plan representative npr hub (dev or minidev) plus one prod hub if the module is used in prod
    - Call out destroy/replace in the PR

# -----------------------------------------------------------------------------
# tf-azure-hub — Azure hub ROOT MODULE (not an env-directory monorepo)
# -----------------------------------------------------------------------------
tf_azure_hub:
  identity:
    description: Single root Terraform module that deploys one Azure Vena hub per pipeline stage via tfvars. Not structured like tf-devops env directories.
    github_actions: disabled (actions_enabled = false in terraform-github)
    owners: saaseng-team
    cicd: Azure DevOps using venasolutions/ado-pipeline-templates (NOT this repo's pipeline-templates/)
    ado_pipeline_templates_ref: refs/tags/v4.11.8
    terraform: "1.11.4 (.tool-versions; gitignored). provider.tf required_version >=1.11.4"
    readme_drift: "Root README terraform-docs table still says terraform >=1.6.5 and stale module tags. Trust provider.tf and module source= lines."

  architecture:
    style: Root module at repo root. One apply = one hub (or DR overlay) selected by -var-file stack.
    do_not: Create terraform/prd/us5/ directories. Hubs are var files.
    resource_files_by_concern:
      - main.tf          # RG, LAW, provider registration
      - locals.tf        # aks/app-gw names, insights KV names, app_configurations merge
      - provider.tf      # required_providers + partial azurerm backend + aliased providers
      - variables.tf     # NOT vars.tf — this is a hard exception vs tf-devops
      - outputs.tf, data.tf, vnet.tf, vnet_locals.tf, vnet_peering.tf
      - k8s.tf, k8s_workload_identities.tf, aca_env.tf, aca_apps.tf
      - app_gw.tf, waf_policy.tf, private_lb.tf, asgs.tf
      - storage_accounts.tf, key_vault.tf, db_mysql.tf, sql_staging.tf
      - audit.tf, api_request.tf, adf.tf, app_configuration.tf
      - cloudamqp.tf, datadog.tf, observe_integration.tf, rbac.tf
      - backup.tf, maintenance_configuration.tf, vmss.tf, private_dns_zones.tf
    monitoring_stack: monitoring/dd_monitors/ is a SEPARATE terraform root with its own pipeline

  var_file_layout: |
    vars/common.tfvars                         # all hubs
    vars/<tier>/tier.tfvars                    # sbx/npr/prd
    vars/<tier>/<subscription>/hub.tfvars      # hub identity, CIDRs, SKU overrides
    vars/<tier>/<subscription>/dr.tfvars       # DR overlay; applied AFTER hub.tfvars
  tiers_and_hubs:
    sbx: [{ name: infra, subscription: sbx-infra, region: centralus, pipeline_moduleName: infra }]
    npr:
      - { name: int, subscription: npr-int, region: centralus, pipeline_moduleName: int }
      - { name: stg, subscription: npr-stg, status: pipeline_stage_commented_out }
    prd:
      - { name: us5, region: eastus, dr: westus }
      - { name: us6, region: centralus, dr: eastus2 }
      - { name: ca4, region: canadacentral, dr: canadaeast }
      - { name: eu3, region: northeurope, dr: westeurope }
  plan_argument_order: |
    terraform plan \
      -var-file=vars/common.tfvars \
      -var-file=vars/<tier>/tier.tfvars \
      [-var-file=vars/sbx/tier.tfvars] \   # sbx-infra also loads npr/tier.tfvars then sbx/tier.tfvars
      -var-file=vars/<tier>/<sub>/hub.tfvars \
      [-var-file=vars/<tier>/<sub>/dr.tfvars]
  naming:
    resource_group: rg-${subscription_type}-${hub_name}-${location}
    dr_resource_group: rg-${subscription_type}-${hub_name}-dr-${dr_location}
    vnet: vnet-${subscription_type}-${hub_name}-${location}
    aks: aks-${subscription_type}-${hub_name}-cluster
    law: law-${subscription_type}-${hub_name}-${location}
  tags:
    default: { ManagedBy: Terraform, GithubRepo: https://github.com/venasolutions/tf-azure-hub, Owner: STO }
    vanta: VantaNonProd from var.vanta_non_prod; prd tier.tfvars sets vanta_non_prod = "false"
    user_data: VantaContainsUserData true only when subscription_type == prd

  providers:
    azurerm_version_pin: ">=4.3.0, <4.77.0  # storage_queue + storage_use_azuread bug; do not bump past 4.77.0 until hashicorp/terraform-provider-azurerm#32617 is in a release"
    storage_use_azuread: true on every azurerm provider
    aliases:
      - azurerm (hub subscription)
      - azurerm.management_sub (ops-mgmt)
      - azurerm.infradevops_sub (npr or prd infra-devops based on var.infra_devops)
      - azurerm.npr_infradevops_sub (always NPR; needed for prd patch-management lookups)
      - azurerm.insights_sub
      - azurerm.global_sub
    secrets: ephemeral azurerm_key_vault_secret for CloudAMQP API key; never commit secrets
    kubernetes_helm: empty provider blocks; configured from AKS module outputs at apply time

  backend:
    in_repo: |
      terraform {
        backend "azurerm" {
          use_azuread_auth = true
        }
      }
    rest_injected_by_pipeline:
      stateFileName: tf-azure-hub          # primary
      stateFileName_dr: tf-azure-hub-dr    # DR stages
      cloud: azure
      tenant: venaprimary
    do_not: Invent resource_group_name/storage_account_name/key inside backend.tf — there is no backend.tf; partial backend lives in provider.tf

  modules:
    style: External git SSH modules pinned by git tag, not relative terraform/modules/
    pattern: |
      #checkov:skip=CKV_TF_1: "Ensure Terraform module sources use a commit hash"
      source = "git@github.com:venasolutions/<repo>.git?ref=vX.Y.Z"
    live_pins_examples:  # README table is stale; copy from the calling .tf
      tf-azure-vnet: v5.0.3
      tf-azure-storage-account: v1.2.2
      tf-azure-event-hub: v1.1.0
      tf-azure-container-apps: v1.1.6
      tf-azure-app-gateway: v2.0.5
      tf-azure-rbac: v1.0.0
      tf-azure-function-app: v1.0.2
      tf-azure-apim: v1.0.2
      tf-azure-data-factory: v1.0.2
      tf-azure-patch-mgmt: v2.5.4
      tf-module-azure-db-mysql-flexible: v2.0.4
      tf-module-azure-secret: v1.0.0
      tf-module-cloudamqp: v2.2.2
      terraform-azurerm-loadbalancer: v1.0.1
      Azure/aks/azurerm: "~> 11.4.0"   # registry module, not git
    when_adding_module:
      - Prefer existing Vena git modules over inline resources when the capability already exists
      - Pin an existing tag used elsewhere in this repo unless the task is a module version bump
      - Pass aliased providers { azurerm = azurerm, azurerm.management_sub = azurerm.management_sub } when the child needs them
      - Gate with count = var.create_* && var.create_environment ? 1 : 0

  feature_flags:
    create_star: APIM, app gateway, key vault, LAW, MySQL, SQL, diagnostics, RSV, WAN hub connection, environment, kubernetes-adjacent
    aca_app_star_enabled: per Container App
    enable_kubernetes: master flag for AKS + AGW integration + related RBAC
    deploy_in_dr_region: DR overlay
  dr_pattern:
    - Same root module; extra -var-file=.../dr.tfvars
    - hub_name becomes e.g. us5-dr; primary_hub_name/primary_location point at primary
    - Flip create_* to false; keep networking/storage as DR tfvars specify
    - WEST US: ZRS unsupported — storage_account_zrs variable is reused with account_replication = LRS (do not rename the variable)
    - npr-int DR and npr-stg stages are commented out in azure-pipelines-npr.yml; do not uncomment without an explicit request
  aks:  # docs/aks.md
    networking: Azure CNI Overlay; ACNS/Cilium default (aks_acns_enabled)
    nap: opt-in (aks_nap_enabled); currently sbx-infra only
    aks_nap_default_node_pools: None recommended so Terraform keeps named pools
    roll_out_env_by_env: never enable NAP/ACNS globally in common.tfvars without a rollout plan
  datadog_monitors:
    path: monitoring/dd_monitors/
    add_service:
      1. New *_monitors.tf locals map
      2. Optional templates/*.tftpl
      3. merge() into all_monitors in hub_monitors.tf (README still says main.tf — live file is hub_monitors.tf)
    module: git@github.com:venasolutions/tf-datadog-mac.git//terraform/modules/dd_monitors
    pipeline: monitoring/datadog-azure-pipelines.yml (older ado-pipeline-templates v3.3.0, pr: none)

  cicd:
    npr_file: pipelines/azure-pipelines-npr.yml
    prd_file: pipelines/azure-pipelines-prd.yml
    stages_per_hub: azure-tf-stages-template.yml@ADOPipelineTemplates
    code_checks: terraform/tf-code-checks-template.yml@ADOPipelineTemplates
    npr: applyFromBranch true; drift schedule + Teams webhook
    prd: one stage pair per hub and *_dr; combine/analyze comment stages at end
    adding_a_hub_requires: new vars tree + new azure-tf-stages-template invocation + moduleNames entries
    auth: Azure WIF service connections named vena-azure-sub-<tier>-<hub>-wif
  pre_commit:
    repo: antonbabenko/pre-commit-terraform v1.91.0
    hooks: [terraform_fmt, terraform_docs, terraform_tflint]
    tflint_disabled: [terraform_unused_declarations, terraform_module_version]
    after_variable_changes: expect README.md terraform-docs refresh

  add_hub_workflow:
    - Add vars/<tier>/<sub>/hub.tfvars (copy nearest geography sibling)
    - Unique vnet_address_space and subnet CIDRs (IPAM; cloudamqp_subnet_cidr often outside the /21)
    - Optional dr.tfvars
    - Wire pipeline stage (service connection, adoEnvironment, azureRegion, var-file list, stateFileName)
    - Do not duplicate .tf resource files per hub
  add_resource_workflow:
    - New concern -> new <concern>.tf at repo root (or extend existing file for the same service)
    - Add variables to variables.tf with description + type
    - Default in variables.tf or common.tfvars; hub-specific overrides only in hub.tfvars
    - count/for_each gated by create_* / enable_*
    - Outputs only for values other stacks need
    - terraform fmt; pre-commit terraform_docs

# -----------------------------------------------------------------------------
# Cross-repo alignment
# -----------------------------------------------------------------------------
do_not_confuse:
  - tf-devops environments are directories; tf-azure-hub environments are tfvars + pipeline stages
  - tf-devops modules are relative paths; tf-azure-hub modules are git:: tags (plus Azure/aks registry)
  - tf-devops variables file is vars.tf; tf-azure-hub root is variables.tf (monitoring/dd_monitors also uses variables.tf)
  - tf-devops state is S3 us-east-1 buckets with simple keys; Azure state is azurerm partial backend filled by ADO
  - DynamoDB locking is terraform-github only, not these two repos
  - Copilot instructions in tf-azure-hub are a one-liner (Azure best practices tool); all real Azure conventions are in .tf + docs/aks.md + this file
  - "all hubs" in CLAUDE.md is AWS hubs only

security:
  - Never commit keys, tokens, PEM files, or tfvars secrets
  - Azure: Key Vault + ephemeral data; AWS: SSM / Secrets Manager data sources
  - Least privilege IAM/RBAC; reuse tf-azure-rbac and existing IAM modules
  - KMS/SSE on by default
  - Checkov runs soft-fail; still avoid introducing CKV findings in new code; use checkov:skip only with a reason matching existing comments

diagnostics:
  - terraform init backend errors: Azure needs ADO/WIF; AWS needs the venacloud-terraform* bucket and credentials. Do not create buckets from terrabot.
  - Plan destroy/replace: annotate PR; do not apply
  - Module version bumps: change one source pin, plan sbx/npr first
  - State migrations: write a runbook; do not run terraform state * autonomously

repositories:
  tf_devops:
    identity:
      repository: "venasolutions/tf-devops"
      cloud: "aws"
      purpose: "AWS Terraform infrastructure monorepo with Azure DevOps CI/CD."
    layout:
      terraform_modules: "terraform/modules/<module_name>/"
      account_roots:
        - "terraform/dev_aws/"
        - "terraform/prod_aws/"
        - "terraform/services_aws/"
        - "terraform/dev_services_aws/"
        - "terraform/network_services/"
        - "terraform/root/"
        - "terraform/datadog/"
        - "terraform/pagerduty/"
      environment_model:
        - "Environments are directories, not Terraform workspaces."
        - "Each runnable root owns separate remote state."
        - "Hub examples include dev, minidev, bolt, us1, eu2, and ca3."
        - "DR roots use a _dr directory suffix."
        - "SQL staging roots use sqlstaging naming variants."
        - "global roots contain account-level resources; devops roots contain CI/CD tooling."
      common_root_files:
        - "backend.tf"
        - "versions.tf"
        - "main.tf"
        - "vars.tf"
        - "outputs.tf"
      variable_filename: "vars.tf"
    architecture:
      root_module:
        name: "vena_datacentre"
        rule: >-
          Vena hub core infrastructure belongs inside vena_datacentre. New hub
          functionality should normally be a dedicated submodule called from
          vena_datacentre and exposed through a feature flag, not a new direct
          sibling module in each hub main.tf.
      approved_direct_hub_satellites:
        - "vena_sqlstaging_peering"
        - "patch_management"
      legacy_direct_satellites:
        examples:
          - "otel_collector"
          - "otel_collector_daemon"
          - "file_metrics"
        rule: "Preserve existing instances but do not extend this legacy pattern for new hub features."
      module_sources:
        default: "Relative local paths under terraform/modules."
        live_exceptions:
          - "terraform-aws-modules/cloudfront/aws"
          - "observeinc/terraform-aws-collection modules pinned to v3.0.0"
          - "venasolutions/terraform-aws-datadog-forwarders pinned to v5.1.0"
        rule: "Copy the exact source and ref from a verified live sibling."
    modules:
      preferred_new_module_files:
        - "main.tf"
        - "vars.tf"
        - "outputs.tf"
        - "versions.tf"
      large_module_pattern: "Split concerns into additional files such as iam.tf, cloudwatch.tf, alb.tf, asg.tf, or kinesis.tf."
      compatibility_exception: >-
        Many legacy modules predate the current four-file instruction. Do not
        add empty files or refactor them merely to satisfy the newer convention.
        Apply the convention to new modules and active refactors.
      feature_flags:
        enable_prefix: "Application services and feature behavior."
        create_prefix: "Stateful, costly, or independently provisioned resources."
        dr_rule: "Expose and wire create flags so expensive resources can remain disabled in DR until a test."
      dr_awareness:
        - "Use is_dr_region when the module pattern supports it."
        - "Gate non-essential alarms and secondary resources using the live module pattern."
        - "Do not indiscriminately disable replicated data, networking, or recovery prerequisites."
    hub_roots:
      locals:
        expected_concepts:
          - "env"
          - "subdomain"
          - "region"
          - "network_base"
          - "source_account_id"
        exception: >-
          Repository guidance says hub main.tf opens with locals, but legacy
          roots may have provider or data blocks first. Do not reorder a working
          root. Reuse the nearest same-type hub structure.
      dr_pattern:
        - "Use a different region and VPC CIDR from the primary hub."
        - "Use a -dr subdomain convention where the live sibling does."
        - "Pass is_dr_region = true where present."
        - "Set expensive create flags false and scale active compute to zero where the live DR sibling does."
        - "Preserve production classification and compliance tags for production DR."
    state_and_backends:
      backend_type: "s3"
      observed_pattern:
        - "backend.tf contains literal bucket, key, and region values for that root."
        - "encrypt = true is common, but some legacy roots differ."
        - "No universal DynamoDB lock-table convention was observed in the supplied snapshot."
      authoring_rule:
        - "Copy the nearest equivalent root's backend shape."
        - "Use a unique state key for a new root."
        - "Do not introduce var.* expressions in the backend block."
        - "Do not assume the old create_env.py output is current policy."
    versions:
      terraform_repository_constraint: ">= 1.11.4"
      aws_provider_common_constraint: "~> 5.34.0"
      pipeline_terraform_version: "1.11.4"
      rule: "The selected root's live versions/backend files override these snapshot values."
    review_ownership:
      default: "@venasolutions/devops-guardians-team"
      dns_firewall_exception: "terraform/modules/vena_datacentre/dns_firewall.tf also requires @venasolutions/information-security-team in the supplied snapshot."
      automation_paths: ".github/workflows/ and .cm/ are owned by @venasolutions/tooling-team."
      rule: "Read live CODEOWNERS; do not hardcode an approver count or bypass path-specific owners."
    pipelines:
      entrypoints:
        - "azure-pipelines_dev.yml"
        - "azure-pipelines_prod.yml"
        - "azure-pipelines_bolt.yml"
        - "azure-pipelines_drift.yml"
      reusable_templates: "pipeline-templates/"
      test_behavior:
        - "Recursive terraform fmt check."
        - "Checkov security analysis; current template settings may be soft-fail."
      plan_behavior:
        - "Initialize the selected environment, validate, and create plan.out."
        - "Publish sanitized JSON/text plan artifacts because plan output may contain sensitive data."
        - "Use Azure DevOps service connections and AWS STS role assumption."
      apply_exception: >-
        Do not state that every production apply is manual. Some pipelines have
        applyFromBranch controls and Azure DevOps environment gates. Read the
        exact entrypoint, template ref, and environment approval configuration.
    new_aws_resource_workflow:
      module_exists:
        - "Read the complete module and all consumers."
        - "Select the correct existing environment consumer file, normally main.tf when verified."
        - "Append or surgically modify the module call using exact sibling inputs and ordering."
      module_missing:
        - "Create terraform/modules/<resource>/ using repository-aligned files and patterns."
        - "Create the environment consumer in the same change."
        - "Do not ask the user to provide a module source when the repository workflow is to create a local module."
      environment_rule: "Never create variables.tf or outputs.tf in an environment root merely to pass module inputs when that root uses direct locals/values in main.tf."
    modification_workflow:
      boolean_gate: "Verify the literal assignment in the complete live environment file, then change only that literal."
      existing_resource: "Modify only the selected block or its verified input; preserve the complete file otherwise."
      creation: "Use exact same-type sibling placement and call structure."

  tf_azure_hub:
    identity:
      repository: "venasolutions/tf-azure-hub"
      cloud: "azure"
      purpose: "A single Azure hub Terraform root parameterized by layered tfvars, plus an isolated Datadog monitoring root."
    layout:
      root_model:
        - "The repository root is the shared Terraform root for hub infrastructure."
        - "Do not create terraform/<environment>/ roots or per-environment backend.tf files."
        - "Concern files at root include aca_apps.tf, aca_env.tf, storage_accounts.tf, db_mysql.tf, key_vault.tf, rbac.tf, vnet.tf, and related files."
      variable_declarations: "variables.tf"
      values:
        common: "vars/common.tfvars"
        tier: "vars/<tier>/tier.tfvars"
        hub: "vars/<tier>/<hub>/hub.tfvars"
        dr: "vars/<tier>/<hub>/dr.tfvars when the pipeline includes it"
      monitoring_exception: "monitoring/dd_monitors is a separate Terraform root with its own backend and Datadog provider behavior."
      local_module_exception: >-
        modules/datadog is a legacy local helper with a non-standard file shape.
        Do not generalize it into a repository-wide module convention.
    provider_and_backend:
      root_backend:
        type: "azurerm"
        pattern: "Partial backend with use_azuread_auth = true; state coordinates are injected by Azure DevOps templates."
        rule: "Never invent state storage account, container, resource group, or key in an environment file."
      terraform_version: ">= 1.11.4"
      provider_snapshot:
        azurerm: ">= 4.3.0, < 4.77.0"
        azuread: ">= 3.0.1"
        "null": "3.2.2"
        local: "2.5.1"
        random: ">= 3.0.0"
        github: "~> 6.0"
        cloudamqp: "1.34.0"
        tls: "4.1.0"
        kubernetes: ">= 2.29.0"
        helm: ">= 2.13.2"
        azapi: "2.7.0"
      important_exception: >-
        Preserve the live azurerm upper-bound regression comment and constraint.
        Do not remove or widen it without a separate verified dependency change.
      provider_aliases:
        - "management_sub"
        - "infradevops_sub"
        - "npr_infradevops_sub"
        - "insights_sub"
        - "global_sub"
      secret_pattern: "Use existing Key Vault, ephemeral, managed identity, or pipeline secret references; never place credentials in tfvars."
    modules:
      dominant_source: "Pinned Git SSH sources under venasolutions."
      public_exception: "Some resources use public registry modules, such as Azure/aks/azurerm."
      snapshot_refs:
        app_gateway: "v2.0.5"
        mysql_flexible: "v2.0.4"
        event_hub: "v1.1.0"
        rbac: "v1.0.0"
        secret: "v1.0.0"
        container_apps: "v1.1.6"
        storage_account: "v1.2.2"
        vnet: "v5.0.3"
        load_balancer: "v1.0.1"
        patch_management: "v2.5.4"
        function_app: "v1.0.2"
        apim: "v1.0.2"
        cloudamqp: "v2.2.2"
        data_factory: "v1.0.2"
        datadog_monitor: "v1.0.1"
      rule: "Always copy the current live source string and ref; the generated README may be stale."
    naming_and_tags:
      naming: "Use the established Azure abbreviations and local naming expressions, such as rg-, law-, and resource-family prefixes."
      tags: "Merge the established shared tags, including current compliance/Vanta tags, rather than replacing them."
      resource_ids: "Azure resource IDs may be legitimate environment inputs, but secrets and credentials may not be committed."
    environment_layering:
      rule: >-
        Change the narrowest layer that expresses the requested scope. A
        single-hub change belongs in that hub's hub.tfvars unless the variable
        is intentionally common or tier-wide. A DR-only value belongs in
        dr.tfvars when the pipeline loads it.
      no_cross_references: "Tfvars assignments must contain concrete HCL values, not var.* references to another object."
      preserve_layers: "Do not copy an environment-specific value into common.tfvars or tier.tfvars without explicit scope evidence."
    container_apps:
      design:
        - "aca_apps.tf defines application metadata in local.default_container_apps."
        - "Each application has an enable control such as var.aca_app_<name>_enabled."
        - "A filtered local.container_apps drives the container-app module in aca_env.tf."
      enable_existing_app: "For one environment, change only the verified most-specific tfvars Boolean when the variable and map entry already exist."
      add_new_app:
        - "Add the nearest-sibling-shaped entry in aca_apps.tf."
        - "Add its Boolean variable declaration in variables.tf."
        - "Add only required role, secret, ingress, domain, or identity wiring demonstrated by the sibling."
        - "Add a hub.tfvars override only when the target environment value differs from the declared/default layer."
        - "Keep aca_env.tf wiring unchanged unless the new app requires a genuinely new module-level capability."
    object_backed_resources:
      examples:
        - "storage accounts"
        - "database instances"
        - "other modules consuming var.<object>.*"
      new_instance_workflow:
        - "Clone the exact nearest sibling module invocation in the correct concern file."
        - "Create a dedicated object-root variable with the same type shape in variables.tf."
        - "Create a concrete object assignment in the target hub.tfvars."
        - "Do not reuse the sibling's object variable as the new instance's configuration root."
        - "Ensure source and target object field sets match when cloning the same variant."
      modification_workflow: "Change only the requested field in the verified object assignment or module input."
    review_ownership:
      default: "@venasolutions/saaseng-team"
      automation_paths: ".github/workflows/ and .cm/ are owned by @venasolutions/tooling-team."
      rule: "Read live CODEOWNERS and allow GitHub/review automation to request the current owners."
    pipelines:
      template_repository: "venasolutions/ado-pipeline-templates"
      snapshot_template_ref: "refs/tags/v3.3.0"
      entrypoints:
        - "pipelines/azure-pipelines-npr.yml"
        - "pipelines/azure-pipelines-prd.yml"
      terraform_version: "1.11.4"
      module_directory: "."
      nonproduction_layers:
        - "vars/common.tfvars"
        - "vars/npr/tier.tfvars"
        - "vars/npr/<hub>/hub.tfvars"
      production_layers:
        - "vars/common.tfvars"
        - "vars/prd/tier.tfvars"
        - "vars/prd/<hub>/hub.tfvars"
        - "optional vars/prd/<hub>/dr.tfvars"
      state_names:
        primary: "tf-azure-hub"
        dr: "tf-azure-hub-dr"
      apply_exception: >-
        The NPR pipeline currently passes applyFromBranch = true for active
        modules. The PRD entrypoint does not define it in the supplied snapshot;
        external template defaults and Azure DevOps environment gates decide the
        effective behavior. Never infer more than the live files show.
    readme_exception: >-
      The root README is generated by terraform-docs and may list stale provider
      or module versions. Use provider.tf, .tool-versions, module source refs,
      and pipeline files for current version truth.
    validation:
      pre_commit_hooks:
        - "terraform_fmt"
        - "terraform_docs"
        - "terraform_tflint"
      tflint_exceptions: "The current pre-commit configuration disables selected unused-declaration and module-version checks; do not claim those checks are enforced when they are disabled."
      scoped_plan: "Use the exact pipeline var-file order for the selected hub and DR mode."

repository_guidance_discovery:
  required_live_paths:
    - ".serena/**"
    - ".Serena/**"
    - ".github/copilot-instructions.md"
    - ".github/instructions/**/*.instructions.md"
    - ".github/PULL_REQUEST_TEMPLATE.md"
    - ".github/CODEOWNERS"
    - "README.md"
    - "terraform/README.md"
    - "terraform/modules/*/README.md"
    - "modules/*/README.md"
    - "pipeline-templates/**"
    - "pipelines/**"
  absence_rule: "Missing optional guidance is not an error and must not be replaced with invented rules."

terrabot_backend_integration:
  prompt_context:
    field_name: "terraform_primary_context"
    intent: "Attach this file to Foundry generation calls before compaction."
    precedence_note: "The field describes conventions; live context_pack remains authoritative current state."
  repository_index:
    role: "Additional durable context for validated decisions, mappings, relationships, and user clarifications."
    write_rule: "Store only facts validated against an exact repository path and commit."
    conflict_rule: "Keep conflict/history metadata; never silently overwrite contradictory evidence."
  cursor_test_generation:
    role: >-
      Cursor analyzes the exact live GitHub commit and produces only natural
      language Phase 1 and Phase 2 test prompts for pre-derived immutable test
      targets. Cursor does not generate Terraform, change files, push branches,
      create PRs, write repository context, or post Teams messages in this flow.
    immutable_case_fields:
      - "repository"
      - "commit_sha"
      - "path"
      - "environment"
      - "flag"
      - "current_value"
      - "desired_value"
    mutable_case_fields:
      - "phase1_prompt"
      - "phase2_prompt"
    fallback: "If Cursor is disabled, unavailable, times out, or returns invalid output, use the existing backend-derived prompts and continue the test run."
  test_execution:
    existing_behavior_to_preserve:
      - "Teams run tests authorization and queue-backed execution."
      - "Live GitHub target discovery."
      - "Phase 1 Terrabot request, clarification handling, deterministic validation, and isolated test branch push."
      - "Validated repository-context addition."
      - "Fresh-conversation Phase 2 context-reuse test."
      - "Durable run state and final proactive Teams report."
    logging_events:
      - "cursor_prompt_generation_started"
      - "cursor_agent_created"
      - "cursor_agent_run_status"
      - "cursor_prompt_case_generated"
      - "cursor_prompt_generation_completed"
      - "cursor_agent_archived"
      - "cursor_agent_archive_failed"
      - "cursor_read_only_violation"
      - "cursor_prompt_generation_failed"
      - "cursor_prompt_fallback_used"
      - "terraform_primary_context_attached"

prohibited_shortcuts:
  - "Do not ask for a path, flag, module, or resource when one verified target exists in the live repository."
  - "Do not manufacture multiple choices from unrelated Boolean flags."
  - "Do not treat README text as stronger than current HCL or pipeline configuration."
  - "Do not use a generic AWS or Azure backend template in place of the repository's real backend pattern."
  - "Do not replace complete files with shortened generated versions."
  - "Do not return only one file when the repository pattern requires a consumer, variable declaration, and environment value together."
  - "Do not let Cursor write infrastructure changes during automated test-prompt generation."
  - "Do not bypass Terrabot validators, branch writers, plan pipelines, or Teams reporting."
